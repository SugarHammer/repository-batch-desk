[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-batch"
version = "0.1.0"
description = "Preview and commit batch changes across Gitee, GitHub, and GitCode repositories"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "respx>=0.22,<1",
    "playwright>=1.48,<2",
    "pyinstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
readme_batch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
